[package]
name = "relay"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui_commonmark = "0.26"
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
ksni = { version = "0.3.7", features = ["blocking"] }

# Runtime helpers are compiled into the single relay binary. These replace the
# previous Python/wl-paste/gdbus/zenity external tools.
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip", "charset", "json"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
wl-clipboard-rs = "0.9"
zbus = "5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

